# =============================================================================
# EXAMPLE FILE - replace with your own samples before running.
#
# SAMPLE map: reconciles the matrix column names (derived from the .raw
# basenames) with the experimental structure. It is consumed to build
# MSDataset.samples and to define the bait-vs-control contrasts for scoring.
#
# The values below are a PUBLIC EXAMPLE that goes with config/baits.yaml:
# fictitious sample names, no real experimental data. Replace them with YOUR
# run names - they must match the column names of your search output
# (MaxQuant / DIA-NN / FragPipe).
#
# condition : short group label (e.g. IP_NCAP, CTRL_NCAP)
# bait_id   : an id from baits.yaml, or 'control' for the controls
# role      : 'bait' (bait Co-IP) or 'control' (IgG/mock/parental)
# replicate : integer >= 1
# raw_file  : name of the raw file / matching column in the matrix
#
# Design recommendation (publishability): >= 3 biological replicates per group
# and one paired negative control (IgG/mock/parental line) per bait.
# =============================================================================
schema_version: 1

samples:
  # ---- Example 1: exogenous bait (NCAP_SARS2) ----
  - sample: NCAP_IP_1
    condition: IP_NCAP
    bait_id: NCAP_SARS2
    role: bait
    replicate: 1
    raw_file: NCAP_IP_1.raw
  - sample: NCAP_IP_2
    condition: IP_NCAP
    bait_id: NCAP_SARS2
    role: bait
    replicate: 2
    raw_file: NCAP_IP_2.raw
  - sample: NCAP_IP_3
    condition: IP_NCAP
    bait_id: NCAP_SARS2
    role: bait
    replicate: 3
    raw_file: NCAP_IP_3.raw
  - sample: NCAP_CTRL_1
    condition: CTRL_NCAP
    bait_id: control
    role: control
    replicate: 1
    raw_file: NCAP_CTRL_1.raw
  - sample: NCAP_CTRL_2
    condition: CTRL_NCAP
    bait_id: control
    role: control
    replicate: 2
    raw_file: NCAP_CTRL_2.raw
  - sample: NCAP_CTRL_3
    condition: CTRL_NCAP
    bait_id: control
    role: control
    replicate: 3
    raw_file: NCAP_CTRL_3.raw

  # ---- Example 2: bait with a mouse orthologue (TP53_HUMAN) ----
  - sample: TP53_IP_1
    condition: IP_TP53
    bait_id: TP53_HUMAN
    role: bait
    replicate: 1
    raw_file: TP53_IP_1.raw
  - sample: TP53_IP_2
    condition: IP_TP53
    bait_id: TP53_HUMAN
    role: bait
    replicate: 2
    raw_file: TP53_IP_2.raw
  - sample: TP53_IP_3
    condition: IP_TP53
    bait_id: TP53_HUMAN
    role: bait
    replicate: 3
    raw_file: TP53_IP_3.raw
  - sample: TP53_CTRL_1
    condition: CTRL_TP53
    bait_id: control
    role: control
    replicate: 1
    raw_file: TP53_CTRL_1.raw
  - sample: TP53_CTRL_2
    condition: CTRL_TP53
    bait_id: control
    role: control
    replicate: 2
    raw_file: TP53_CTRL_2.raw
  - sample: TP53_CTRL_3
    condition: CTRL_TP53
    bait_id: control
    role: control
    replicate: 3
    raw_file: TP53_CTRL_3.raw

# Bait-vs-control contrasts evaluated by the scoring (SAINT/MSstats).
contrasts:
  - name: NCAP_vs_CTRL
    bait_id: NCAP_SARS2
    test: IP_NCAP
    control: CTRL_NCAP
  - name: TP53_vs_CTRL
    bait_id: TP53_HUMAN
    test: IP_TP53
    control: CTRL_TP53
