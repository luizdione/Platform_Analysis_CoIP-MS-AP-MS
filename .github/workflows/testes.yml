name: testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  nucleo-cpu:
    name: nucleo CPU (sem GPU, sem R)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar o pacote e as dependencias de teste
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web,ms]"

      - name: pytest
        run: python -m pytest -q

      - name: Autoteste do pipeline em dados sinteticos
        env:
          BONDER_OFFLINE: "1"
        run: python -m bonder.cli selftest

      - name: Conferir que nenhum dado de experimento foi versionado
        run: |
          set -eu
          erro=0

          # 1. Diretorios de dados do usuario e de anotacao de trabalho: nunca versionados.
          for p in .project-memory data runs inputs outputs; do
            if [ -e "$p" ]; then
              echo "ERRO: '$p' nao deve existir no repositorio"; erro=1
            fi
          done

          # 2. Dados brutos e sequencias: nunca versionados.
          if git ls-files | grep -Ei '\.(raw|mzml|wiff|fasta|fa|faa)$'; then
            echo "ERRO: arquivo de dados ou de sequencia versionado"; erro=1
          fi

          # 3. Markdown na raiz: so a documentacao do produto. Qualquer outro arquivo
          #    de anotacao, memoria ou configuracao de ferramenta que apareca na raiz
          #    e barrado aqui, sem precisar listar nomes um a um.
          permitidos="README.md CHANGELOG.md THIRD_PARTY_NOTICES.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md"
          for f in $(git ls-files --full-name -- '*.md' | grep -v '/' || true); do
            case " $permitidos " in
              *" $f "*) ;;
              *) echo "ERRO: '$f' nao e documentacao do produto; mova para docs/ ou remova"; erro=1 ;;
            esac
          done

          [ "$erro" -eq 0 ] || exit 1
          echo "ok: nenhum dado de experimento nem anotacao de trabalho versionados"
