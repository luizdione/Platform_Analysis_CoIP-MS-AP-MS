name: publish image to GHCR

# Publishes the analysis image as a public container package linked to this
# repository. It runs only when you want it to: on a published release or from
# the "Run workflow" button. It does not run on every push.
#
# It uses the Action's own GITHUB_TOKEN (permissions: packages: write) - no
# personal token needed.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (e.g. v1.0.1). Empty = default branch."
        required: false
        default: ""
      tag:
        description: "Image tag (e.g. 1.0.1). Empty = 'latest' only."
        required: false
        default: ""

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # On a manual run, an empty 'ref' checks out the DEFAULT BRANCH - not the
      # version tag. Tagging an image with a version number from the branch makes
      # that tag stop matching what was released. So: to publish a version, give
      # the git tag in 'ref' (e.g. v1.0.1), or publish from the release, which
      # already builds from the tag's own commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Refuse to tag a version from a moving ref
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
        run: |
          set -eu
          ref='${{ github.event.inputs.ref }}'
          case "$ref" in
            v*|refs/tags/*) echo "ok: building from tag '$ref'" ;;
            *)
              echo "ERROR: asking for image tag '${{ github.event.inputs.tag }}' without"
              echo "a git tag in 'ref' would tag a version with the branch contents."
              echo "Pass ref=v<version>, or publish from the release."
              exit 1 ;;
          esac

      - name: Lowercase image name
        id: name
        run: echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Platform_Analysis_CoIP-MS-AP-MS
            org.opencontainers.image.description=Local platform for CoIP-MS / AP-MS analysis and identification of protein-protein interaction partners in the mouse proteome. Orchestrates published proteomics tools (SAINTexpress, MiST, DEP/limma/MSstats) in reproducible containers. Contains no experimental data.
            org.opencontainers.image.licenses=LicenseRef-Platform_Analysis_CoIP-MS-AP-MS
            org.opencontainers.image.authors=Luiz Dione Barbosa De-Melo <luiz.melo@ifrj.edu.br>

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.analysis
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
