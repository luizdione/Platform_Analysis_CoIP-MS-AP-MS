name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cpu-core:
    name: CPU core (no GPU, no R)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install the package and the test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web,ms]"

      - name: pytest
        run: python -m pytest -q

      - name: Pipeline self-test on synthetic data
        env:
          BONDER_OFFLINE: "1"
        run: python -m bonder.cli selftest

      - name: Check that no experimental data was versioned
        run: |
          set -eu
          failed=0

          # 1. User data and working-memory directories: never versioned.
          for p in .project-memory data runs inputs outputs; do
            if [ -e "$p" ]; then
              echo "ERROR: '$p' must not exist in the repository"; failed=1
            fi
          done

          # 2. Raw data and sequences: never versioned.
          if git ls-files | grep -Ei '\.(raw|mzml|wiff|fasta|fa|faa)$'; then
            echo "ERROR: a data or sequence file is versioned"; failed=1
          fi

          # 3. Markdown at the repository root: product documentation only. Any other
          #    notes, memory or tool-configuration file that shows up there is rejected
          #    here, without having to list names one by one.
          allowed="README.md CHANGELOG.md THIRD_PARTY_NOTICES.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md"
          for f in $(git ls-files --full-name -- '*.md' | grep -v '/' || true); do
            case " $allowed " in
              *" $f "*) ;;
              *) echo "ERROR: '$f' is not product documentation; move it to docs/ or remove it"; failed=1 ;;
            esac
          done

          [ "$failed" -eq 0 ] || exit 1
          echo "ok: no experimental data and no working notes are versioned"
