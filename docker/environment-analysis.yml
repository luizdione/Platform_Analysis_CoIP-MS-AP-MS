# =============================================================================
# Conda environment of the ANALYSIS container (CPU): Python + R/Bioconductor + SAINT.
# It gathers the gold-standard, peer-reviewed tools in a single reproducible
# environment, so the worker can call Rscript and SAINTexpress via subprocess.
# =============================================================================
name: bonder-analysis
channels:
  - conda-forge
  - bioconda
dependencies:
  # --- Python (orchestration/web/worker) ---
  - python=3.11
  - numpy>=1.25
  - pandas>=2.0
  - pyarrow>=14
  - scipy>=1.11
  - networkx>=3.1
  - matplotlib>=3.7
  - pyyaml>=6.0
  - requests>=2.31
  - flask>=2.3
  - gunicorn>=21
  - rq>=1.15
  - redis-py>=5.0
  - pyteomics>=4.6
  # --- R + Bioconductor: gold-standard statistics ---
  - r-base>=4.3
  - bioconductor-dep          # DEP: AP-MS differential enrichment (limma)
  - bioconductor-limma        # moderated t-test (empirical Bayes)
  - bioconductor-msstats      # feature-level differential quantification
  - r-dplyr
  # NOTE: SAINTexpress does NOT exist as a conda package; it is compiled from
  # source (SourceForge) in Dockerfile.analysis (best-effort, never breaks the build).
  - pip
  - pip:
      - gprofiler-official>=1.0
