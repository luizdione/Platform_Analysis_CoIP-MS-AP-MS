# =============================================================================
# bonder - NVIDIA GPU overlay. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#
# Requires the NVIDIA Container Toolkit on the host (Windows 11 + WSL2, or Linux).
# It adds the 'gpu' service with the accelerated tools (DIA-NN, MS2Rescore,
# AlphaPeptDeep, ESM2). The default stack (web/worker) stays on CPU and always
# starts; 'gpu' is used on demand:
#   docker compose ... run --rm gpu bonder --help
#   docker compose ... run --rm gpu python -m bonder.gpu.tools ...
# =============================================================================
services:
  gpu:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gpu
    environment:
      BONDER_DATA_ROOT: /data
      BONDER_RUNS_DIR: /runs
      # cooperative sharing with a local LLM (Ollama) through gpu_gate
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      - ./inputs:/inputs
      - bonder-data:/data
      - bonder-runs:/runs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # does not start on 'up'; use 'run' / '--profile gpu'
    profiles: ["gpu"]
