# =============================================================================
# bonder - the project's conda environment.
# Create it:                  conda env create -f environment.yml    (name: bonder)
# Update it later:            conda env update -n bonder -f environment.yml
# To install into an environment you already have:
#                             conda env update -n YOUR_ENV -f environment.yml
# =============================================================================
name: bonder
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy>=1.25
  - pandas>=2.0
  - pyarrow>=14
  - scipy>=1.11
  - networkx>=3.1
  - matplotlib>=3.7
  - pyyaml>=6.0
  - requests>=2.31
  - flask>=2.3
  - gunicorn>=21
  - redis-py>=5.0
  - rq>=1.15
  - pyteomics>=4.6
  - pip
  - pip:
      - gprofiler-official>=1.0
# GPU (torch cu124, transformers, ms2rescore, peptdeep) and the R statistics
# (DEP/limma/MSstats + SAINTexpress) are provided by the dedicated containers
# (docker/Dockerfile.gpu and docker/Dockerfile.analysis) for maximum reproducibility.
