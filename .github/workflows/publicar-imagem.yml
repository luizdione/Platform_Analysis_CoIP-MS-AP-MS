name: publicar imagem no GHCR

# Publica a imagem de analise como pacote publico de contêiner, ligado a este
# repositorio. Dispara so quando voce quer: numa release publicada ou no botao
# "Run workflow". Nao dispara a cada push.
#
# Usa o GITHUB_TOKEN da propria Action (permissions: packages: write) - nao
# precisa de token pessoal.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref a construir (ex.: v1.0.1). Vazio = branch padrao."
        required: false
        default: ""
      tag:
        description: "Tag da imagem (ex.: 1.0.1). Vazio = 'latest' apenas."
        required: false
        default: ""

env:
  REGISTRY: ghcr.io

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # No disparo manual, 'ref' vazio pega o BRANCH PADRAO - e nao a tag da
      # versao. Marcar uma imagem com um numero de versao a partir do branch faz
      # a tag deixar de corresponder ao que foi lancado. Por isso: para publicar
      # uma versao, informe a tag git em 'ref' (ex.: v1.0.1), ou publique pela
      # release, que ja constroi do proprio ponto da tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Recusar marcar versao a partir de ref movel
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
        run: |
          set -eu
          ref='${{ github.event.inputs.ref }}'
          case "$ref" in
            v*|refs/tags/*) echo "ok: construindo da tag '$ref'" ;;
            *)
              echo "ERRO: pedir a tag de imagem '${{ github.event.inputs.tag }}' sem informar"
              echo "uma tag git em 'ref' marcaria uma versao com o conteudo do branch."
              echo "Informe ref=v<versao>, ou publique pela release."
              exit 1 ;;
          esac

      - name: Nome da imagem em minusculas
        id: nome
        run: echo "imagem=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados (tags e labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.nome.outputs.imagem }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Platform_Analysis_CoIP-MS-AP-MS
            org.opencontainers.image.description=Local platform for CoIP-MS / AP-MS analysis and identification of protein-protein interaction partners in the mouse proteome. Orchestrates published proteomics tools (SAINTexpress, MiST, DEP/limma/MSstats) in reproducible containers. Contains no experimental data.
            org.opencontainers.image.licenses=LicenseRef-Platform_Analysis_CoIP-MS-AP-MS
            org.opencontainers.image.authors=Luiz Dione Barbosa De-Melo <luiz.melo@ifrj.edu.br>

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.analysis
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
