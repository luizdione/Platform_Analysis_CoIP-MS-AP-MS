# =============================================================================
# bonder - MOUSE reference databases, PINNED BY VERSION (reproducibility).
#
# Never use 'latest'. Each source has a version + URL + expected sha256. The
# downloader (bonder/db/downloader.py) writes to a content-addressed cache,
# verifies the checksum and FAILS if it diverges. Run 'bonder db sync' once to
# populate the cache.
#
# Any sha256 left as null: fill it in on the first sync (the downloader prints
# the observed hash) and commit it, pinning the version for good.
# =============================================================================
schema_version: 1

# Root of the data cache (overridable with BONDER_DATA_ROOT).
data_root: data
# Offline mode: use only what is already cached; clear error if anything is missing.
offline: false

organism:
  name: Mus musculus
  taxid: 10090

sources:
  uniprot_mouse:
    description: "UniProt reference proteome, Mus musculus (reviewed Swiss-Prot)"
    release: "2024_06"
    # UniProtKB REST stream (reviewed, taxid 10090), canonical FASTA:
    fasta_url: "https://rest.uniprot.org/uniprotkb/stream?format=fasta&query=%28reviewed%3Atrue%29+AND+%28organism_id%3A10090%29"
    # id <-> gene <-> xrefs table (for crosswalks):
    tsv_url: "https://rest.uniprot.org/uniprotkb/stream?format=tsv&fields=accession,gene_primary,gene_synonym,protein_name,xref_string,xref_biogrid&query=%28reviewed%3Atrue%29+AND+%28organism_id%3A10090%29"
    include_trembl: false            # include unreviewed entries (TrEMBL)?
    # sha256 pinned from the reused proteome (release 2024_06, 17267 sequences,
    # downloaded 2026-07-02). The downloader reuses the cache if this hash matches.
    sha256_fasta: "a103a735db36b1d8e087d6040fa61cb02b56ca04656ab72de35dd21ee93631e0"
    sha256_tsv: "f0cb728fbf0e9b5e82b260deeb4011ff8126e416352db69c01ee981d4589fafb"

  string_mouse:
    description: "STRING v12.0 - Mus musculus PPI network (10090)"
    version: "12.0"
    links_url: "https://stringdb-downloads.org/download/protein.links.v12.0/10090.protein.links.v12.0.txt.gz"
    aliases_url: "https://stringdb-downloads.org/download/protein.aliases.v12.0/10090.protein.aliases.v12.0.txt.gz"
    min_combined_score: 400          # 400 = medium confidence; 700 = high
    sha256_links: "803775e1d1a47864561e41944bf1f988094a836991e7cf13e4229233fc8cff3d"
    sha256_aliases: "2f1ccd371548d9db5784d341984209431a26573c3b34f16161bfe9052168159c"

  biogrid_mouse:
    description: "BioGRID - Mus musculus interactions (tab3)"
    version: "4.4.235"
    url: "https://downloads.thebiogrid.org/Download/BioGRID/Release-Archive/BIOGRID-4.4.235/BIOGRID-ORGANISM-4.4.235.tab3.zip"
    organism_file: "BIOGRID-ORGANISM-Mus_musculus-4.4.235.tab3.txt"
    sha256: "4547644ed0157e4e2fcfd239f222a1be218f8a04e75081762b46b2772ffdb088"

  contaminants:
    description: "cRAP contaminants (GPM) - AP-MS filter. Zenodo mirror (Gatto/camprotR, CC-BY)."
    version: "gpm-zenodo-15115102"
    url: "https://zenodo.org/records/15115102/files/crap_gpm.fasta?download=1"
    sha256: "4b0e6e97ab1d618baa38be612a787d884a781e07f627b919c4b29ac064db5382"

  crapome_mouse:
    description: "CRAPome-style background (optional; or computed from the user's own controls)"
    version: "user-supplied"
    url: null                        # CRAPome export supplied by the user
    sha256: null
