# =============================================================================
# EXAMPLE FILE - replace with your own baits before running.
#
# Declarative definition of a project's BAITS. The values below are a PUBLIC,
# teaching EXAMPLE built from UniProt reference sequences: this repository holds
# no experimental data from anyone.
#
# The example covers the two cases the pipeline treats differently:
#
#   1. A bait EXOGENOUS to the host proteome, with NO orthologue in the host
#      (host-pathogen design). SAINT + MiST; orthology-based prioritisation off.
#   2. A bait from ANOTHER SPECIES that DOES have a host orthologue. The host
#      orthologue is kept DISTINCT from the bait, so that the co-precipitated
#      host protein remains a legitimate finding.
#
# Baits never enter the scoring as preys in the host proteome denominator, and
# are kept as separate rows.
#
# To adapt: replace the ids, display_name values, UniProt accessions and FASTA
# files (see config/sequences/README.md) with those of your own Co-IP.
# =============================================================================
schema_version: 1

organism_sample:
  name: Mus musculus
  taxid: 10090

baits:
  # --- Example 1: exogenous bait with no mouse orthologue (host-pathogen) -----
  # SARS-CoV-2 nucleoprotein N (UniProt P0DTC9). Used here only as a public
  # example of a viral bait: it is one of the targets in the host-pathogen
  # interactome of Gordon et al., Nature 2020 - the same design MiST scores.
  - id: NCAP_SARS2
    display_name: "Nucleoprotein N (SARS-CoV-2)"
    source: viral
    uniprot_accession: P0DTC9
    fasta: sequences/NCAP_SARS2.fasta
    # Header under which the bait appears in the search FASTA (search_db.fasta):
    search_db_header: "sp|P0DTC9|NCAP_SARS2 Nucleoprotein OS=SARS-CoV-2 OX=2697049"
    ortholog_prior: false            # no mouse orthologue -> prior DISABLED
    scoring:
      saint: true
      mist: true                     # host-pathogen paradigm (Krogan lab)
    notes: >
      Bait exogenous to the host. The expected interactors are host (mouse)
      proteins. With no mouse orthologue, orthology-based prioritisation is
      disabled; exploratory embedding-based prioritisation, if enabled, falls
      back to novelty/outlier. Use this entry as the template for any exogenous
      bait: viral, bacterial, a synthetic construct or a tag.

  # --- Example 2: bait from another species WITH a mouse orthologue ----------
  # Human p53 (TP53, UniProt P04637), whose mouse orthologue Trp53 (P02340) must
  # stay DISTINCT from the bait. A heavily annotated reference protein, chosen
  # only to illustrate how the bait/orthologue pair is handled.
  - id: TP53_HUMAN
    display_name: "p53 (TP53, Homo sapiens)"
    source: human
    uniprot_accession: P04637
    fasta: sequences/TP53_HUMAN.fasta
    search_db_header: "sp|P04637|P53_HUMAN Cellular tumor antigen p53 OS=Homo sapiens OX=9606"
    ortholog:
      mouse_gene: Trp53
      mouse_accession: P02340        # MOUSE orthologue: keep DISTINCT from the bait
    ortholog_prior: true
    scoring:
      saint: true
      mist: false
    notes: >
      Bait from another species. Do NOT collapse it with the mouse orthologue
      Trp53 (P02340): the human sequence is the bait (excluded from prey
      scoring), but co-precipitated mouse Trp53 is a legitimate finding
      (self-association/interaction). Peptides shared between P04637 and P02340
      should be flagged.
